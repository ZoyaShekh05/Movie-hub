
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | Movie Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        ::selection {
            background: #9333ea;
            color: white;
        }

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: #08050f;
        }

        ::-webkit-scrollbar-thumb {
            background: #4c1d95;
            border-radius: 20px;
        }
    </style>
</head>

<body class="bg-[#08050f] min-h-screen text-white overflow-x-hidden">

    <!-- Background Glow -->

    
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-96 h-96
                    bg-purple-600/20 rounded-full blur-[120px]">
        </div>

        <div class="absolute top-1/3 -right-40 w-96 h-96
                    bg-pink-600/15 rounded-full blur-[120px]">
        </div>

        <div class="absolute bottom-0 left-1/3 w-96 h-96
                    bg-indigo-600/10 rounded-full blur-[120px]">
        </div>
    </div>


    <!-- Navbar -->
    <nav class="max-w-7xl mx-auto px-5 sm:px-8 py-6
                flex items-center justify-between">

        <a href="index.html"
           class="flex items-center gap-3 group">

            <div class="w-11 h-11 rounded-xl
                        bg-gradient-to-br from-purple-600 to-pink-500
                        flex items-center justify-center
                        shadow-lg shadow-purple-600/30
                        group-hover:scale-105 transition">

                <span class="text-xl">🎬</span>

            </div>

            <div>
                <h1 class="text-xl sm:text-2xl font-bold">
                    Movie <span class="text-purple-400">Hub</span>
                </h1>

                <p class="text-[10px] text-gray-500 uppercase tracking-[3px]">
                    Movie Details
                </p>
            </div>

        </a>


        <a href="index.html"
           class="px-4 py-2 rounded-lg
                  bg-white/5 border border-white/10
                  text-sm text-gray-300
                  hover:bg-purple-600/20
                  hover:text-white
                  transition">

            ← Back to Movies

        </a>

    </nav>


    <!-- Main -->
    <main class="max-w-6xl mx-auto px-5 sm:px-8 py-8 sm:py-16">

        <!-- Movie Details will be inserted here -->
        <div id="movie-detail">

            <!-- Loading UI -->
            <div class="flex flex-col items-center justify-center
                        min-h-[400px] text-center">

                <div class="w-12 h-12 rounded-full
                            border-4 border-purple-500/20
                            border-t-purple-500
                            animate-spin">
                </div>

                <p class="mt-5 text-gray-500">
                    Loading movie details...
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="border-t border-white/5">

        <div class="max-w-7xl mx-auto px-5 sm:px-8 py-8
                    flex flex-col sm:flex-row
                    items-center justify-between gap-3">

            <p class="text-sm text-gray-600">
                © 2026 Movie Hub
            </p>

            <p class="text-sm text-gray-600">
                Explore • Discover • Watch 🍿
            </p>

        </div>

    </footer>


    <script src="movie-details.js"></script>

</body>
</html>
